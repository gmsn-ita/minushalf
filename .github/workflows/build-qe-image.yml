name: Build QE Docker Image

on:
  push:
    branches: [qe_container]
    paths:
      - docker/Dockerfile
      - .github/workflows/build-qe-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qe-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-qe-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build QE base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: minushalf-qe:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=qe-base-amd64
          cache-to: type=gha,scope=qe-base-amd64,mode=max

      - name: Verify QE environment
        run: |
          docker run --rm minushalf-qe:ci bash -euo pipefail -c '
            python --version
            mpirun --version
            for executable in pw.x projwfc.x ld1.x virtual_v2.x; do
              command -v "$executable"
            done
          '

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish QE base image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/minushalf-qe-base"
          docker tag minushalf-qe:ci "$image:qe-7.5-$GITHUB_SHA"
          docker tag minushalf-qe:ci "$image:qe-7.5"
          docker push "$image:qe-7.5-$GITHUB_SHA"
          docker push "$image:qe-7.5"
