name: QE CI

on:
  push:
    branches: [qe_container]
  pull_request:
    branches: [qe_execute, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qe-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-minushalf-qe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # CI uses its own loaded image, so first-time publication and private
      # GHCR package permissions cannot race with or block the tests.
      - name: Build or reuse cached QE base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: minushalf-qe:ci
          cache-from: type=gha,scope=qe-ci-amd64
          cache-to: type=gha,scope=qe-ci-amd64,mode=max

      - name: Record test provenance
        run: |
          mkdir -p ci-artifacts
          git rev-parse HEAD > ci-artifacts/commit.txt
          docker image inspect minushalf-qe:ci > ci-artifacts/image.json


      - name: Install MinusHalf and run unit and material integration tests
        run: |
          docker run --rm --init \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf \
            minushalf-qe:ci \
            bash -euo pipefail -c '
              python -m pip install -e . pytest pytest-mock 2>&1 | tee ci-artifacts/install.log
              python -m pip check
              python -m pip freeze > ci-artifacts/python-packages.txt
              python -m pytest -q --junitxml=ci-artifacts/pytest.xml 2>&1 | tee ci-artifacts/pytest.log

              python -m unittest discover -s tests/integration/qe -p test_report.py -v 2>&1 | tee ci-artifacts/report-tests.log
              python tests/integration/qe/run_cases.py
            '

      - name: Collect material comparison
        if: always()
        run: |
          # Container-created reports belong to root. Collect in the container
          # too; the host fallback only handles an image-build failure.
          if docker image inspect minushalf-qe:ci >/dev/null 2>&1; then
            docker run --rm \
              -v "$PWD:/workspace/minushalf" \
              -w /workspace/minushalf minushalf-qe:ci \
              python tests/integration/qe/run_cases.py --summarize
          else
            python3 tests/integration/qe/run_cases.py --summarize
          fi
          cat ci-artifacts/qe/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci-artifacts/*.txt
            ci-artifacts/*.json
            ci-artifacts/*.xml
            ci-artifacts/*.log
            ci-artifacts/qe/summary.csv
            ci-artifacts/qe/summary.md
            ci-artifacts/qe/*/result.json
            ci-artifacts/qe/*/baseline/*.out
            ci-artifacts/qe/*/baseline/*.json
            ci-artifacts/qe/*/minushalf/*.log
            ci-artifacts/qe/*/minushalf/*.dat
            ci-artifacts/qe/*/minushalf/*.json
            ci-artifacts/qe/*/minushalf/*.in
            ci-artifacts/qe/*/minushalf/*.yaml
            ci-artifacts/qe/*/minushalf/minushalf_corrected_potentials/*.UPF
