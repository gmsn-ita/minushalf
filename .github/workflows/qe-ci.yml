name: QE CI

on:
  push:
    branches:
      - qe_container

  workflow_dispatch:

jobs:
  test-minushalf-qe:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Pull QE Docker image
        run: |
          docker pull \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5

      - name: Run QE silicon SCF with MPI
        run: |
          cp minushalf/fixtures/Si/Si.upf \
             tests/integration/qe/si/Si.upf

          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf/tests/integration/qe/si \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5 \
            bash -c '
              set -e

              mpirun -np 2 pw.x < si_scf.in > si_scf.out

              grep -q "convergence has been achieved" si_scf.out
              grep -q "JOB DONE" si_scf.out

              grep -E \
                "Parallel version|total energy|convergence has been achieved|JOB DONE" \
                si_scf.out
            '

      - name: Install MinusHalf and run tests
        run: |
          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5 \
            bash -c '
              python -m pip install -e .
              python -m pip install pytest pytest-mock
              python -m pytest -q
            '

      - name: Run MinusHalf QE integration workflow
        run: |
          mkdir -p tests/integration/qe/minushalf-execute

          cp tests/integration/qe/si/si_scf.in \
             tests/integration/qe/minushalf-execute/si1.in

          cp minushalf/fixtures/Si/Si.upf \
             tests/integration/qe/minushalf-execute/Si.UPF

          cat > tests/integration/qe/minushalf-execute/minushalf.yaml <<'YAML'
          software: QE

          qe:
              pw_command: ['/opt/quantum-espresso/bin/pw.x']
              projwfc_command: ['/opt/quantum-espresso/bin/projwfc.x']
              ld1_command: ['/opt/quantum-espresso/bin/ld1.x']
              virtual_v2_command: ['mpirun', '-np', '4', '/opt/quantum-espresso/upflib/virtual_v2.x']
              input_file: ./si1.in

          atomic_program:
              exchange_correlation_code: pz
              calculation_code: ae
              max_iterations: 100

          correction:
              correction_code: v
              potfiles_folder: ./
              amplitude: 1.0
              indirect: .true.
          YAML

          sed -i 's/Si\.upf/Si.UPF/' \
            tests/integration/qe/minushalf-execute/si1.in

          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf/tests/integration/qe/minushalf-execute \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5 \
            bash -c '
              set -e

              python -m pip install -e /workspace/minushalf

              minushalf execute 2>&1 | tee minushalf_execute.log

              test -f minushalf_results.dat

              echo
              echo "===== MinusHalf results ====="
              cat minushalf_results.dat
            '
