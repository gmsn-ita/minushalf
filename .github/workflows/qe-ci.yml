name: QE CI

on:
  push:
    branches:
      - qe_container

  workflow_dispatch:

jobs:
  test-minushalf-qe:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Pull QE Docker image
        run: |
          docker pull \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5

      - name: Run QE silicon SCF with MPI
        run: |
          cp minushalf/fixtures/Si/Si.upf \
             tests/integration/qe/si/Si.upf

          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf/tests/integration/qe/si \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5 \
            bash -c '
              set -e

              mpirun -np 2 pw.x < si_scf.in > si_scf.out

              grep -q "convergence has been achieved" si_scf.out
              grep -q "JOB DONE" si_scf.out

              grep -E \
                "Parallel version|total energy|convergence has been achieved|JOB DONE" \
                si_scf.out
            '

      - name: Install MinusHalf and run tests
        run: |
          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5 \
            bash -c '
              python -m pip install -e .
              python -m pip install pytest pytest-mock
              python -m pytest -q
            '
