name: QE CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - qe_container

  workflow_dispatch:

jobs:
  test-minushalf-qe:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build QE Docker image for testing
        run: |
          docker build \
            -f docker/Dockerfile \
            -t minushalf-qe:ci \
            .

      - name: Run QE silicon SCF with MPI
        run: |
          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf/tests/integration/qe/si \
            minushalf-qe:ci \
            bash -c '
              set -e

              mpirun -np 2 pw.x < si1.in > si1.out

              grep -q "convergence has been achieved" si1.out
              grep -q "JOB DONE" si1.out

              grep -E \
                "Parallel version|highest occupied|total energy|convergence has been achieved|JOB DONE" \
                si1.out
            '

      - name: Install MinusHalf and run tests
        run: |
          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf \
            minushalf-qe:ci \
            bash -c '
              set -euo pipefail

              python -m pip install -e .
              python -m pip install pytest pytest-mock
              python -m pytest -q
            '

      - name: Run MinusHalf QE integration workflow
        run: |
          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf/tests/integration/qe/si \
            minushalf-qe:ci \
            bash -c '
              set -euo pipefail

              python -m pip install -e /workspace/minushalf

              minushalf execute 2>&1 | tee minushalf_execute.log

              test -f minushalf_results.dat

              echo
              echo "===== MinusHalf results ====="
              cat minushalf_results.dat
            '
