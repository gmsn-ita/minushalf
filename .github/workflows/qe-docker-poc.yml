name: QE Docker PoC

on:
  push:
    branches:
      - qe_container
  workflow_dispatch:

jobs:
  test-qe-container:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner architecture
        run: |
          uname -a
          uname -m
          docker --version

      - name: Build QE Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t minushalf-qe:ci \
            .

      - name: Verify QE environment
        run: |
          docker run --rm minushalf-qe:ci bash -c '
            echo "PATH=$PATH"
            python --version
            mpirun --version
            command -v pw.x
            command -v projwfc.x
            command -v ld1.x
            command -v virtual_v2.x
          '

      - name: Run QE silicon SCF with MPI
        run: |
          cp minushalf/fixtures/Si/Si.upf \
             tests/integration/qe/si/Si.upf

          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf/tests/integration/qe/si \
            minushalf-qe:ci \
            bash -c '
              set -e

              mpirun -np 2 pw.x < si_scf.in > si_scf.out

              grep -q "convergence has been achieved" si_scf.out
              grep -q "JOB DONE" si_scf.out

              grep -E \
                "Parallel version|total energy|convergence has been achieved|JOB DONE" \
                si_scf.out
            '

      - name: Install MinusHalf and run tests
        run: |
          docker run --rm \
            -e OMPI_ALLOW_RUN_AS_ROOT=1 \
            -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
            -v "$PWD:/workspace/minushalf" \
            -w /workspace/minushalf \
            minushalf-qe:ci \
            bash -c '
              python -m pip install -e .
              python -m pip install pytest pytest-mock
              python -m pytest -q
            '

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Publish QE Docker image
        run: |
          docker tag \
            minushalf-qe:ci \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5

          docker push \
            ghcr.io/marcosegv/minushalf-qe-base:qe-7.5
